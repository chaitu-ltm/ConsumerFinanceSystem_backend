spring.application.name=authentication-service
server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT
security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.expiration-ms=86400000

# Bootstrap Admin
security.bootstrap-admin.first-name=System
security.bootstrap-admin.last-name=Admin
security.bootstrap-admin.email=admin@cfs.com
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD}
