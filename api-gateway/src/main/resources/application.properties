spring.application.name=api-gateway

server.port=8080

# =========================================
# GATEWAY WEBFLUX
# =========================================
spring.cloud.gateway.server.webflux.enabled=true

# =========================================
# AUTHENTICATION ROUTE
# Direct URL temporarily for debugging
# =========================================
spring.cloud.gateway.server.webflux.routes[0].id=authentication-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**


# =========================================
# ADMIN USER ROUTE -> AUTHENTICATION SERVICE
# =========================================
spring.cloud.gateway.server.webflux.routes[1].id=authentication-admin-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/admin/users/**

# =========================================
# EUREKA
# =========================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# =========================================
# ACTUATOR
# =========================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only


#==============================================
# CUSTOMER SERVICE Route
#==============================================
spring.cloud.gateway.server.webflux.routes[2].id=customer-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/customers/**,/api/admin/kyc/**

# =========================================
# FINANCE APPLICATION SERVICE
# =========================================
spring.cloud.gateway.server.webflux.routes[3].id=finance-application-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://FINANCE-APPLICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/loan-products/**,/api/applications/**

# =========================================
# CREDIT ASSESSMENT APPLICATION SERVICE
# =========================================
spring.cloud.gateway.server.webflux.routes[4].id=credit-assessment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://CREDIT-ASSESSMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/credit-assessments/**

#==========================================
# APPROVAL APPLICATION SERVICE
# =========================================
spring.cloud.gateway.server.webflux.routes[5].id=approval-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://APPROVAL-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/approvals/**

# =========================================
# DISBURSEMENT APPLICATION SERVICE
# =========================================
spring.cloud.gateway.server.webflux.routes[6].id=disbursement-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://DISBURSEMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/disbursements/**

# =========================================
# EMI SERVICE
# =========================================
spring.cloud.gateway.server.webflux.routes[7].id=emi-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://EMI-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/emi/**,/api/emi/repayments/**

# =========================================
# NOTIFICATION APPLICATION SERVICE
# =========================================
spring.cloud.gateway.server.webflux.routes[8].id=notification-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/notifications/**
