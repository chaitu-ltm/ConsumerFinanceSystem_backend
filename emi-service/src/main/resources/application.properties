spring.application.name=emi-service
server.port=8087

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/emi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# JWT
security.jwt.secret-base64=${JWT_SECRET_BASE64}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always