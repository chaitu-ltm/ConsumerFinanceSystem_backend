spring.application.name=finance-application-service

server.port=8083


# ==============================
# DATABASE
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/application_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:root}


# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true


# ==============================
# EUREKA
# ==============================

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# ==============================
# OPENFEIGN
# ==============================

spring.cloud.openfeign.circuitbreaker.enabled=true

# Required shared HS256 key; no development fallback.
security.jwt.secret-base64=${JWT_SECRET_BASE64}


# ==============================
# RESILIENCE4J
# ==============================

resilience4j.circuitbreaker.instances.customerService.sliding-window-size=5

resilience4j.circuitbreaker.instances.customerService.minimum-number-of-calls=3

resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state=10s


# ==============================
# ACTUATOR
# ==============================

management.endpoints.web.exposure.include=health,info