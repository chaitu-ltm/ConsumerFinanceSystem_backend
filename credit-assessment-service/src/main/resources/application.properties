spring.application.name=credit-assessment-service
server.port=8084

# ==============================
# MySQL
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/credit_assessment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Eureka
# ==============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.openfeign.client.config.finance-application-service.connectTimeout=2000
spring.cloud.openfeign.client.config.finance-application-service.readTimeout=5000

# ==============================
# JWT
# ==============================

security.jwt.secret-base64=${JWT_SECRET_BASE64}

# ==============================
# Actuator
# ==============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================================
# CREDIT ASSESSMENT SERVICE
# =========================================

spring.cloud.gateway.server.webflux.routes[6].id=credit-assessment-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://CREDIT-ASSESSMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/credit-assessments/**